services:
  db:
    image: postgres:15-alpine
    container_name: tracker_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tracker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracker_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - tracker_network

  seed_data:
    build: .
    container_name: tracker_seeder
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/tracker_db
    command: python seed.py
    networks:
      - tracker_network

  web:
    build: .
    container_name: tracker_fastapi_web
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/tracker_db
    networks:
      - tracker_network

volumes:
  postgres_data:

networks:
  tracker_network:
    driver: bridge
